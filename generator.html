<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechRepair - Master License Key Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .generator-card {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #ffffff;
            font-family: monospace;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #15803d;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #0f172a;
            border-radius: 6px;
            border: 1px dashed #16a34a;
            display: none;
            text-align: center;
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #4ade80;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* UPGRADE FEATURE: Modernized horizontal key layout container */
        .key-container {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            justify-content: center;
            align-items: center;
        }
        .key-display {
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 4px;
            letter-spacing: 1.5px;
            user-select: all;
            border: 1px solid #334155;
            flex: 1;
            text-align: center;
            overflow-x: auto;
            white-space: nowrap;
        }
        .copy-btn {
            width: auto;
            background-color: #38bdf8;
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 4px;
        }
        .copy-btn:hover {
            background-color: #0284c7;
        }
        .copy-success-toast {
            font-size: 13px;
            color: #4ade80;
            font-weight: 600;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="generator-card">
    <h1>🔑 Master License Generator</h1>
    <p style="color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 25px; text-align: center;">
        Keep this file safe on your personal laptop. Use it to unlock the inventory app for authorized devices.
    </p>

    <form id="genForm">
        <div class="form-group">
            <label for="customerHWID">Paste Customer Hardware ID (HWID):</label>
            <input type="text" id="customerHWID" required placeholder="e.g., HWID-1284759" autocomplete="off">
        </div>
        <button type="submit">Generate Activation Key</button>
    </form>

    <div class="result-box" id="resultBox">
        <h3>Generated Activation Key</h3>
        <!-- UPGRADE FEATURE: Integrated interactive flex copy container -->
        <div class="key-container">
            <div class="key-display" id="keyOutput">KEY-XXXXXXXX</div>
            <button type="button" class="copy-btn" id="copyKeyBtn" title="Copy Key to Clipboard">📋 Copy</button>
        </div>
        <div class="copy-success-toast" id="copyToast">✔️ Key copied directly to clipboard!</div>
    </div>
</div>

<script>
    const SECRET_SALT = "TECH_REPAIR_NIGERIA_2026_PRO";

    const genForm = document.getElementById('genForm');
    const resultBox = document.getElementById('resultBox');
    const keyOutput = document.getElementById('keyOutput');
    const copyKeyBtn = document.getElementById('copyKeyBtn');
    const copyToast = document.getElementById('copyToast');

    genForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const hwidIn = document.getElementById('customerHWID').value.trim();

        if (!hwidIn.startsWith("HWID-")) {
            alert("⚠️ Error: Invalid format! A real Hardware ID must start with 'HWID-'");
            return;
        }

        let checkHash = 0;
        const validationString = hwidIn + SECRET_SALT + "LICENSED";
        
        for (let i = 0; i < validationString.length; i++) {
            checkHash = (checkHash << 5) - checkHash + validationString.charCodeAt(i);
            checkHash |= 0;
        }
        
        const finalGeneratedKey = "KEY-" + Math.abs(checkHash);

        // Reset toast state from any previous generations
        copyToast.style.display = 'none';
        copyKeyBtn.innerHTML = '📋 Copy';
        copyKeyBtn.style.backgroundColor = '#38bdf8';

        keyOutput.innerText = finalGeneratedKey;
        resultBox.style.display = 'block';
    });

    // UPGRADE FEATURE: Native clipboard API async copying with interactive UI feedback transitions
    copyKeyBtn.addEventListener('click', function() {
        const textToCopy = keyOutput.innerText;

        navigator.clipboard.writeText(textToCopy).then(function() {
            copyKeyBtn.innerHTML = '✅ Copied';
            copyKeyBtn.style.backgroundColor = '#16a34a';
            copyToast.style.display = 'block';
            
            // Gracefully reset button visuals after 3 seconds
            setTimeout(function() {
                copyKeyBtn.innerHTML = '📋 Copy';
                copyKeyBtn.style.backgroundColor = '#38bdf8';
            }, 3000);
        }).catch(function() {
            alert("❌ Failed to auto-copy. Please highlight the text manually.");
        });
    });
</script>

</body>
</html>
